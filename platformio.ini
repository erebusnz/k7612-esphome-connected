[platformio]
default_envs = keypad_reader

[env]
platform = intel_mcs51@2.2.0
board = STC8C2K32S2
board_build.f_cpu = 24000000L
build_flags = --std-sdcc11
monitor_speed = 9600
; Flash explicitly with tools/Flash-STC.ps1; target power is cycled manually.

[env:uart_smoke]
build_src_filter = +<uart_smoke.c>

[env:pin_watch]
build_src_filter = +<main.c>

[env:matrix_test]
build_src_filter = +<matrix_test.c>

[env:rfid_firmware_test]
build_src_filter = +<rfid_firmware_test.c>

[env:keypad_reader]
build_src_filter = +<keypad_reader.c>
; Bench verified via P3.3/P3.2 sense inputs: HIGH pulls external D0/D1 LOW.
build_flags = ${env.build_flags} -DK7612_WIEGAND_ACTIVE=1 -DK7612_WIEGAND_BITS=34
